name: python build wheels

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [ master ]

env:
  FORCE_COLOR: 3

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_sdist:
    name: Build SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: false

    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Build SDist
      run: pipx run build --sdist

    - name: Check metadata
      run: pipx run twine check dist/*

    - uses: actions/upload-artifact@v7
      with:
        name: wheelhouse-sdist
        path: dist/*.tar.gz
        overwrite: true

  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Build wheels
      uses: pypa/cibuildwheel@v3.4.1
      env:
        MACOSX_DEPLOYMENT_TARGET: "10.13"
        CIBW_ARCHS_MACOS: universal2
        # abi3 (see [tool.scikit-build.wheel] in pyproject.toml, targeting
        # cp39) means the cp39 build's wheel is already tagged
        # cp39-abi3-<platform> and covers every Python 3.9+ interpreter —
        # building cp310/cp311/cp312 separately would just repeat the same
        # binary under different tags.
        #
        # (A second step below builds the cp313-abi3 flavour for 3.13+.)
        #
        # Free-threaded Python (3.13t, 3.14t) has no stable ABI yet (abi3t starts with 3.15 and
        # needs Cython and scikit-build-core support), so those get one version-specific wheel each
        # (cp313-cp313t, cp314-cp314t). scikit-build-core ignores py-api for them, and
        # httpp_cy.pyx declares freethreading_compatible, so the GIL stays off after import.
        CIBW_BUILD: "cp39-* cp313t-* cp314t-*"
        CIBW_ENABLE: cpython-freethreading
        CIBW_SKIP: pp*

    # A second abi3 flavour with a higher floor. wheel.py-api=cp313 makes the same sources build against the
    # 3.13 stable ABI, so the wheel is tagged cp313-abi3-<platform>. pip prefers the more specific tag, so
    # Python 3.13+ gets this one and 3.9 to 3.12 keep cp39-abi3. The 3.13+ build may use the stable-ABI
    # functions added in 3.10 to 3.13 without breaking the older wheel. It goes to its own folder so the
    # first step's wheels are never touched.
    - name: Build wheels (abi3, Python 3.13+)
      uses: pypa/cibuildwheel@v3.4.1
      with:
        output-dir: wheelhouse-abi3-313
      env:
        MACOSX_DEPLOYMENT_TARGET: "10.13"
        CIBW_ARCHS_MACOS: universal2
        CIBW_BUILD: "cp313-*"
        CIBW_SKIP: pp*
        CIBW_CONFIG_SETTINGS: "wheel.py-api=cp313"

    - uses: actions/upload-artifact@v7
      with:
        name: wheelhouse-${{ matrix.os }}
        path: |
          wheelhouse/*.whl
          wheelhouse-abi3-313/*.whl
        overwrite: false
