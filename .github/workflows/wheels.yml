name: python build wheels

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [ master ]

env:
  FORCE_COLOR: 3

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_sdist:
    name: Build SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: false

    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Build SDist
      run: pipx run build --sdist

    - name: Check metadata
      run: pipx run twine check dist/*

    - uses: actions/upload-artifact@v7
      with:
        name: wheelhouse-sdist
        path: dist/*.tar.gz
        overwrite: true

  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Build wheels
      uses: pypa/cibuildwheel@v4.3.1
      env:
        MACOSX_DEPLOYMENT_TARGET: "10.13"
        CIBW_ARCHS_MACOS: universal2
        # Wheel layout (one build per platform for each row):
        #   cp39-abi3        every GIL-enabled Python from 3.9 up (the cp39-* selector;
        #                    see py-api = "cp39" in pyproject.toml).
        #   cp313t / cp314t  free-threaded 3.13 and 3.14: abi3 cannot be loaded by
        #                    free-threaded builds, so each gets a version-specific
        #                    wheel (this is where the no-GIL speed comes from).
        #   cp315t           free-threaded 3.15: abi3t (PEP 803, wheel.py-api =
        #                    "cp315.cp315t" in scikit-build-core >= 1.0) would replace
        #                    this and all later cpXXXt wheels, but it needs the PEP 793
        #                    export hook, which released Cython versions do not generate
        #                    yet. Until then 3.15t keeps a version-specific wheel.
        #
        # Free-threaded builds are enabled by default since cibuildwheel 4 (the old
        # "cpython-freethreading" enable group no longer exists), and 3.15 is built
        # without any prerelease flag.
        CIBW_BUILD: "cp39-* cp313t-* cp314t-* cp315t-*"
        # rpds-py (needed by jsonschema at build time) has no free-threaded wheel in its newest release; prefer an older
        # binary over compiling the newest sdist with Rust.
        CIBW_ENVIRONMENT: PIP_PREFER_BINARY=1
        CIBW_SKIP: pp*

    - uses: actions/upload-artifact@v7
      with:
        name: wheelhouse-${{ matrix.os }}
        # A single path keeps the artifact flat (several paths would preserve
        # their parent folders and end up as dist/wheelhouse/... after download).
        path: wheelhouse/*.whl
        overwrite: false
