name: docs

# Builds the documentation site in docs/site (ADR-0060). The orchestrator calls it on every push to master and on tags; it is
# informational there (release-wheels does not wait for it). On pull requests it runs only when the site changes. Publishes nothing.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [ master ]
    paths:
      - "docs/site/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - uses: actions/setup-node@v6
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: docs/site/package-lock.json
    - name: Both languages have every snippet
      run: python3 scripts/prepare.py all
    - name: Build and install httpp
      working-directory: .
      run: pip install .
    - name: Snippets build, run and do what their pages say
      run: python3 scripts/test_snippets.py
    - name: Install
      run: npm ci
    - name: Type check
      run: npm run typecheck
    - name: Build
      run: npm run build
