name: pages

# Publishes the documentation site (docs/site, ADR-0060) to GitHub Pages: https://mohammadraziei.github.io/httpp/
# docs.yml checks the site (examples, type check, build) and publishes nothing; this workflow builds it again and deploys it.
# Like every other workflow it has no push trigger of its own: the orchestrator calls it (workflow_call) and gives the deploy job the
# permissions it needs (pages: write, id-token: write). The old push filter on paths moved into the `changed` job below, because a
# called workflow cannot filter by path: a push to master deploys only when a file of the site changed, a manual run always deploys.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.diff.outputs.site }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - id: diff
      env:
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        BEFORE: ${{ github.event.before }}
      run: |
        site=false
        if [[ "$EVENT" == "workflow_dispatch" ]]; then
          site=true
        elif [[ "$REF" == "refs/heads/master" ]]; then
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            site=true   # first push, or a force push that lost the old commit: do not guess
          elif git diff --name-only "$BEFORE" HEAD | grep -Eq '^(docs/site/|examples/|benchmarks/results/full/[^/]*\.json$|\.github/workflows/pages\.yml$)'; then
            site=true
          fi
        fi
        echo "site=${site}" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: changed
    if: needs.changed.outputs.site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - uses: actions/setup-node@v6
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: docs/site/package-lock.json
    - name: Snippets and benchmark data
      run: python3 scripts/prepare.py all
    - name: Install
      run: npm ci
    - name: Build
      run: npm run build
    - uses: actions/upload-pages-artifact@v3
      with:
        path: docs/site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
