[build-system]
requires = [
    "scikit-build-core[pyproject]",
    "cython",
    "cython-cmake",
    "jsonschema",
    "jinja2",
]
build-backend = "scikit_build_core.build"

[project]
name = "httpp"
dynamic = ["version"]
description = "A Cython project with scikit-build"
authors = [
    {name = "Mohammad Raziei", email = "mohammadraziei1375@gmail.com"},
]
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = []

[project.scripts]
httpp = "httpp.__main__:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-xdist>=3.0",
    "pytest-cov>=4.0",
]

[project.urls]
"Homepage" = "https://github.com/MohammadRaziei/httpp"
"Bug Tracker" = "https://github.com/MohammadRaziei/httpp/issues"
"Document" = "https://MohammadRaziei.github.io/httpp"


[tool.setuptools.package-dir]
httpp = "src/bindings/python/httpp"

[tool.scikit-build.cmake]
version = ">=3.21"
build-type = "Release"

# Stable ABI (abi3), targeted at the oldest Python this project builds for
# (see CIBW_BUILD in .github/workflows/wheels.yml). This is what makes
# SKBUILD_SABI_VERSION/SKBUILD_SABI_COMPONENT non-empty in
# src/bindings/python/CMakeLists.txt, so a single compiled extension
# (cp39-abi3-<platform>) works unmodified on 3.9 through whatever version
# is current — one wheel build per platform instead of one per Python
# minor version. The Cython bindings (httpp_cy.pyx) only wrap plain C++
# calls with no manual buffer-protocol/PyObject-internals access, so they
# don't touch anything outside the limited API.
[tool.scikit-build.wheel]
py-api = "cp39"

[tool.scikit-build]
sdist.include = [
    "src/third_party/cpp-httplib/**/*",
    "src/third_party/mbedtls/**/*",
    "src/third_party/liburlparser/**/*",
]

[tool.scikit-build.install]
components = ["httpp_wheel"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "include/httpp.h"
regex = '''(?sx)
\#define \s+ HTTPP_VERSION_MAJOR \s+ (?P<major>\d+) .*?
\#define \s+ HTTPP_VERSION_MINOR \s+ (?P<minor>\d+) .*?
\#define \s+ HTTPP_VERSION_PATCH \s+ (?P<patch>\d+) .*?
'''
result = "{major}.{minor}.{patch}"


[tool.cibuildwheel]
skip = "*i686*"
test-command = "pytest {project}/tests"
test-extras = ["test"]

[tool.cibuildwheel.linux]
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3