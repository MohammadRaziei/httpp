[build-system]
requires = [
    "scikit-build-core[pyproject]>=1.1",  # [[tool.dynamic-metadata]] (see below)
    "cython>=3.1",  # freethreading_compatible (see httpp_cy.pyx)
    "cython-cmake",
    "jsonschema",
    "jinja2",
]
build-backend = "scikit_build_core.build"

[project]
name = "httpp"
dynamic = ["version"]
description = "A Cython project with scikit-build"
authors = [
    {name = "Mohammad Raziei", email = "mohammadraziei1375@gmail.com"},
]
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Free Threading :: 1 - Unstable",
]
requires-python = ">=3.8"
dependencies = []

[project.scripts]
httpp = "httpp.__main__:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-xdist>=3.0",
    "pytest-cov>=4.0",
]

[project.urls]
"Homepage" = "https://github.com/MohammadRaziei/httpp"
"Bug Tracker" = "https://github.com/MohammadRaziei/httpp/issues"
"Document" = "https://MohammadRaziei.github.io/httpp"


[tool.setuptools.package-dir]
httpp = "src/bindings/python/httpp"

[tool.scikit-build.cmake]
version = ">=3.21"
build-type = "Release"

# Stable ABI (abi3), targeted at the oldest Python this project builds for
# (see CIBW_BUILD in .github/workflows/wheels.yml). This is what makes
# SKBUILD_SABI_VERSION/SKBUILD_SABI_COMPONENT non-empty in
# src/bindings/python/CMakeLists.txt, so a single compiled extension
# (cp39-abi3-<platform>) works unmodified on 3.9 through whatever version
# is current — one wheel build per platform instead of one per Python
# minor version. The Cython bindings (httpp_cy.pyx) only wrap plain C++
# calls with no manual buffer-protocol/PyObject-internals access, so they
# don't touch anything outside the limited API.
#
# Free-threaded Python cannot load abi3 wheels, so CI builds cp313t, cp314t and
# cp315t separately (see wheels.yml); scikit-build-core ignores py-api for them.
[tool.scikit-build.wheel]
py-api = "cp39"

[tool.scikit-build]
sdist.include = [
    "src/third_party/cpp-httplib/**/*",
    "src/third_party/asio/**/*",
    "src/third_party/mbedtls/**/*",
    "src/third_party/liburlparser/**/*",
]

[tool.scikit-build.install]
components = ["httpp_wheel"]

[[tool.dynamic-metadata]]
field = "version"
provider = "scikit_build_core.metadata.regex"
input = "include/httpp.h"
regex = '''(?sx)
\#define \s+ HTTPP_VERSION_MAJOR \s+ (?P<major>\d+) .*?
\#define \s+ HTTPP_VERSION_MINOR \s+ (?P<minor>\d+) .*?
\#define \s+ HTTPP_VERSION_PATCH \s+ (?P<patch>\d+) .*?
'''
result = "{major}.{minor}.{patch}"


[tool.cibuildwheel]
skip = "*i686*"
# faulthandler_timeout dumps every thread's stack when a test runs longer than
# 120 s (it does not kill the test), so a hang shows where it is stuck.
test-command = "pytest {project}/tests -o faulthandler_timeout=120"
test-extras = ["test"]

[tool.cibuildwheel.linux]
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

# httpp_core.dll is shipped in httpp/lib/ and loaded at import time through
# os.add_dll_directory (see httpp/__init__.py), so no DLL needs to be bundled.
# cibuildwheel 3.x did not repair Windows wheels; cibuildwheel 4.x runs delvewheel
# by default, which cannot find httpp_core.dll next to the extension and fails.
[tool.cibuildwheel.windows]
repair-wheel-command = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
]
faulthandler_timeout = 120
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3