  function wake() {
    wrap.classList.remove("idle"); clearTimeout(idle);
    if (kind === "video" && !m.paused) idle = setTimeout(function () { wrap.classList.add("idle"); }, 2500);
  }
  ["timeupdate", "progress", "durationchange", "loadedmetadata"].forEach(function (n) { m.addEventListener(n, ui); });
  m.addEventListener("play", function () { play.innerHTML = ICON.pause; wake(); });
  m.addEventListener("pause", function () { play.innerHTML = ICON.play; wake(); });
  m.addEventListener("volumechange", function () {
    vol.set(m.muted ? 0 : m.volume); mute.innerHTML = m.muted || m.volume === 0 ? ICON.mute : ICON.vol; store("vol", m.volume);
  });
  m.addEventListener("ended", function () { if (list.at < list.items.length - 1) step(1, true); });
  m.addEventListener("error", function () {
    if (m !== media) return;
    pv.textContent = ""; pv.appendChild(el("div", "error", "This browser cannot play this file. Use Download or Open raw."));
  });
  // Some webm files carry no duration; seeking far past the end makes the browser find it.
  m.addEventListener("loadedmetadata", function () {
    if (m.duration !== Infinity) return;
    m.currentTime = 1e101; m.addEventListener("timeupdate", function fix() { m.removeEventListener("timeupdate", fix); m.currentTime = 0; });
  });
  if (kind === "video") { m.onclick = toggle; m.ondblclick = fs; }
  wrap.addEventListener("pointermove", wake);
  wrap.onkeydown = function (ev) {
    if (ev.ctrlKey || ev.altKey || ev.metaKey) return;
    var k = ev.key, used = true; wake();
    if (k === " " && ev.target.tagName !== "BUTTON") toggle();
    else if (k === "ArrowLeft") m.currentTime -= 5;
    else if (k === "ArrowRight") m.currentTime += 5;
    else if (k === "ArrowUp") { m.volume = Math.min(1, m.volume + 0.05); m.muted = false; }
    else if (k === "ArrowDown") m.volume = Math.max(0, m.volume - 0.05);
    else if (k === "m") m.muted = !m.muted;
    else if (k === "f" && canfs) fs();
    else used = false;
    if (used) ev.preventDefault();
  };

  media = m; m.preload = "metadata";
  var v = parseFloat(store("vol")); m.volume = isNaN(v) ? 1 : Math.min(1, Math.max(0, v)); m.playbackRate = rate;
  m.src = rawUrl(cur.p);
  pv.appendChild(wrap); ui(); wake();
  mute.innerHTML = m.volume === 0 ? ICON.mute : ICON.vol; vol.set(m.volume); speed.textContent = rate + "x";
  if ($("dlg").open) wrap.focus();
  if (auto) toggle();
}

var seq = 0;
function load() {
  var mine = ++seq; state.path = hashPath(); state.filter = ""; $("q").value = "";
  fetch(C.base + "/api/list?path=" + encodeURIComponent(state.path), { headers: { Accept: "application/json" } })
    .then(function (r) { if (r.status === 404) throw new Error("This folder does not exist (or is not available)."); if (!r.ok) throw new Error("The server answered " + r.status + "."); return r.json(); })
    .then(function (j) { if (mine !== seq) return; state.entries = j.entries; state.truncated = j.truncated; render(); })
    .catch(function (e) { if (mine === seq) { state.entries = []; render(e.message); } });
}

$("q").oninput = function () { state.filter = this.value; render(); };
$("vlist").onclick = function () { state.view = "list"; store("view", "list"); render(); };
$("vgrid").onclick = function () { state.view = "grid"; store("view", "grid"); render(); };
$("theme").onclick = function () { state.theme = state.theme === "auto" ? "light" : state.theme === "light" ? "dark" : "auto"; store("theme", state.theme); applyTheme(); };
var closing = false, downOutside = false;
function closeDlg() {
  var d = $("dlg"); if (closing || !d.open) return;
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) { d.close(); return; }
  closing = true; d.classList.add("out");
  setTimeout(function () { d.classList.remove("out"); closing = false; d.close(); }, 170);
}
// Only a press on the backdrop counts: it is aimed at the dialog itself. A press on anything inside (a full screen video covers the whole screen, far outside the dialog box) never does.
function outside(ev) { var d = $("dlg"), r = d.getBoundingClientRect(); return ev.target === d && (ev.clientX < r.left || ev.clientX > r.right || ev.clientY < r.top || ev.clientY > r.bottom); }
$("pd").innerHTML = ICON.download; $("po").innerHTML = ICON.ext; $("pc").innerHTML = ICON.x;
$("pc").onclick = closeDlg;
$("dlg").addEventListener("cancel", function (ev) { ev.preventDefault(); closeDlg(); });
$("dlg").addEventListener("pointerdown", function (ev) { downOutside = outside(ev); });
$("dlg").addEventListener("click", function (ev) { if (downOutside && outside(ev)) closeDlg(); downOutside = false; });
$("dlg").addEventListener("close", function () { stop(); $("pv").textContent = ""; });
window.addEventListener("hashchange", load);
applyTheme(); load();
})();
</script>
</body>
